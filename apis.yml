name: Anmet

description: 'Anmet is a Poland‑based enterprise specializing in waste management and recycling of metallic and composite materials. It offers comprehensive solutions for metal scrap handling, recycling of wind‑turbine blade composites, and innovative projects for recovering carbon and glass fibers. The company participates in EU‑funded research, collaborates internationally, and provides services to industrial clients across Europe.'

